<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AIRI — About the founder</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262a33;
    --text: #e8e9ec;
    --muted: #9aa0ac;
    --accent: #6ea8fe;
    --safe: #3ecf8e;
    --warning: #f2b84b;
    --exceeded: #f2555a;
    --inset: #0f1115;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .top-bar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .top-bar a { color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 600; }
  .top-bar a:hover { text-decoration: underline; }

  .profile-header { text-align: center; margin: 24px 0 8px; }
  .avatar {
    width: 128px; height: 128px; border-radius: 50%;
    margin: 0 auto 18px; display: block;
    object-fit: cover;
    border: 2px solid var(--border);
    background: var(--panel);
  }
  .avatar-initial {
    width: 128px; height: 128px; border-radius: 50%;
    margin: 0 auto 18px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--accent), #9b7ef2);
    color: #0f1115; font-size: 48px; font-weight: 700;
  }
  h1 { font-size: 24px; margin: 0 0 2px; }
  .role-line { color: var(--text); font-size: 15px; margin: 0 0 6px; font-weight: 600; }
  .location-line { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  .tagline { color: var(--muted); font-size: 15px; font-style: italic; max-width: 480px; margin: 0 auto 22px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    margin-top: 18px;
  }
  .bio-text { white-space: pre-line; margin: 0; color: var(--text); font-size: 14.5px; }

  .links-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 22px; }
  .links-row a {
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 16px;
  }
  .links-row a:hover { border-color: var(--accent); color: var(--accent); }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
  }
  .empty-state p { margin: 0 0 8px; }

  .site-footer {
    margin-top: 48px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    text-align: center;
    color: var(--muted);
    font-size: 12px;
  }
  .site-footer a { color: var(--muted); text-decoration: underline; margin: 0 6px; }
  .site-footer a:hover { color: var(--accent); }

  .hidden { display: none !important; }
</style>
<script>
  // Site-wide theme (see admin.html "Appearance" panel, airi/theme.py):
  // fetch the active theme + day/night settings plus the theme catalog,
  // then set the 10 CSS custom properties this page's :root declares
  // (bg/panel/border/text/muted/accent/safe/warning/exceeded/inset) at
  // runtime. Placed in <head>, before <body>, so the fetch starts as
  // early as possible and the flash of the built-in default (Midnight)
  // look is brief. Fails open — the page keeps its default look — on
  // any error, same convention as the site-visibility check elsewhere.
  (function () {
    var API_BASE = "https://airi-mvp-api.onrender.com";
    var VARS = ["bg", "panel", "border", "text", "muted", "accent", "safe", "warning", "exceeded", "inset"];

    function parseTime(hhmm) {
      var parts = (hhmm || "").split(":");
      return (parseInt(parts[0], 10) || 0) * 60 + (parseInt(parts[1], 10) || 0);
    }

    function isNight(cfg) {
      if (!cfg.theme_auto_day_night) return false;
      var now = new Date();
      var mins = now.getHours() * 60 + now.getMinutes();
      var dayMins = parseTime(cfg.theme_day_start);
      var nightMins = parseTime(cfg.theme_night_start);
      if (dayMins === nightMins) return false;
      if (dayMins < nightMins) return mins < dayMins || mins >= nightMins;
      return mins >= nightMins && mins < dayMins;
    }

    function applyVars(vars) {
      var root = document.documentElement.style;
      for (var i = 0; i < VARS.length; i++) {
        if (vars && vars[VARS[i]]) root.setProperty("--" + VARS[i], vars[VARS[i]]);
      }
    }

    Promise.all([
      fetch(API_BASE + "/config").then(function (r) { return r.json(); }),
      fetch(API_BASE + "/theme-catalog").then(function (r) { return r.json(); })
    ]).then(function (results) {
      var cfg = results[0], catalog = results[1];
      var themes = catalog.themes || [];
      var active = null;
      for (var i = 0; i < themes.length; i++) {
        if (themes[i].key === cfg.theme) { active = themes[i]; break; }
      }
      if (!active) active = themes[0];
      if (!active) return;
      function apply() { applyVars(isNight(cfg) ? active.night : active.day); }
      apply();
      if (cfg.theme_auto_day_night) setInterval(apply, 60000);
    }).catch(function () {
      // Fail open — page keeps its built-in default (Midnight/night) look.
    });
  })();
</script>
</head>
<body>
  <div class="wrap">
    <div class="top-bar"><a href="index.html">← Back to AIRI</a></div>

    <div id="emptyState" class="empty-state hidden">
      <p>No author profile has been set up yet.</p>
      <p><a href="index.html">← Back to AIRI</a></p>
    </div>

    <div id="profileContent" class="hidden">
      <div class="profile-header">
        <img id="avatarImg" class="avatar hidden" alt="" />
        <div id="avatarInitial" class="avatar-initial hidden"></div>
        <h1 id="nameEl"></h1>
        <p id="roleLine" class="role-line hidden"></p>
        <p id="locationLine" class="location-line hidden"></p>
        <p id="taglineEl" class="tagline hidden"></p>
      </div>

      <div id="bioPanel" class="panel hidden">
        <p id="bioText" class="bio-text"></p>
      </div>

      <div id="linksRow" class="links-row"></div>
    </div>

    <div class="site-footer">
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
      <a href="developers.html">For developers</a>
    </div>
  </div>

<script>
  const API_BASE = "https://airi-mvp-api.onrender.com";

  function safeHttpUrl(value) {
    if (!value || !/^https?:\/\//i.test(value)) return null;
    try {
      new URL(value);
      return value;
    } catch (e) {
      return null;
    }
  }

  function safeMailto(value) {
    if (!value || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) return null;
    return "mailto:" + value;
  }

  function addLink(container, href, label) {
    if (!href) return;
    const a = document.createElement("a");
    a.href = href;
    a.textContent = label;
    if (href.startsWith("http")) {
      a.target = "_blank";
      a.rel = "noopener";
    }
    container.appendChild(a);
  }

  async function loadAuthor() {
    let profile;
    try {
      const res = await fetch(`${API_BASE}/author`);
      profile = await res.json();
    } catch (e) {
      profile = null;
    }

    if (!profile || !profile.name) {
      document.getElementById("emptyState").classList.remove("hidden");
      return;
    }

    document.getElementById("profileContent").classList.remove("hidden");
    document.getElementById("nameEl").textContent = profile.name;

    const roleParts = [profile.title, profile.company].filter(Boolean);
    if (roleParts.length) {
      const roleLine = document.getElementById("roleLine");
      roleLine.textContent = roleParts.join(" · ");
      roleLine.classList.remove("hidden");
    }

    if (profile.location) {
      const loc = document.getElementById("locationLine");
      loc.textContent = profile.location;
      loc.classList.remove("hidden");
    }

    if (profile.tagline) {
      const tag = document.getElementById("taglineEl");
      tag.textContent = profile.tagline;
      tag.classList.remove("hidden");
    }

    if (profile.photo_data_url) {
      const img = document.getElementById("avatarImg");
      img.src = profile.photo_data_url;
      img.alt = profile.name;
      img.classList.remove("hidden");
    } else {
      const initial = document.getElementById("avatarInitial");
      initial.textContent = profile.name.trim().charAt(0).toUpperCase();
      initial.classList.remove("hidden");
    }

    if (profile.bio) {
      document.getElementById("bioText").textContent = profile.bio;
      document.getElementById("bioPanel").classList.remove("hidden");
    }

    const linksRow = document.getElementById("linksRow");
    addLink(linksRow, safeMailto(profile.email), "Email");
    addLink(linksRow, safeHttpUrl(profile.website), "Website");
    addLink(linksRow, safeHttpUrl(profile.linkedin), "LinkedIn");
    addLink(linksRow, safeHttpUrl(profile.twitter), "X / Twitter");
    addLink(linksRow, safeHttpUrl(profile.github), "GitHub");
  }

  loadAuthor();
</script>
</body>
</html>
